# Tetragon z větve v1.7 (budoucí 1.7.2) s cilium/ebpf v0.22.0: umí BTF hlavičku jádra 7.x
# (cilium/ebpf #2041/#2042), takže odpadá upravená kopie BTF (kairos-common tetragon-btf-compat).
# Jen agent (Dockerfile, target release) jako upstream build-images-releases.yml; image do ghcr.
name: simecka-image
on:
  push:
    branches: [simecka/v1.7]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: verze
        run: echo "v=v1.7.1-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          build-args: |
            TETRAGON_VERSION=${{ steps.verze.outputs.v }}
          push: true
          tags: |
            ghcr.io/simeckape-dev/tetragon:${{ steps.verze.outputs.v }}
            ghcr.io/simeckape-dev/tetragon:simecka-v1.7
