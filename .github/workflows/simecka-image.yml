# Tetragon agent přímo z repozitáře cilium/tetragon na PEVNÉM commitu větve v1.7 (cilium/ebpf v0.22.0: umí BTF
# hlavičku jádra 7.x, cilium/ebpf #2041/#2042). Vydání v1.7.1 opravu nemá. Až vyjde v1.7.2/v1.8.0, použít
# oficiální quay.io/cilium/tetragon a fork zrušit. Posun commitu = změna TETRAGON_COMMIT níže (přes PR).
# Jen agent (Dockerfile, target release) jako upstream build-images-releases.yml.
name: simecka-image
on:
  push:
    branches: [simecka/v1.7]
  workflow_dispatch:
env:
  TETRAGON_COMMIT: 034abc86cea029deebe31dcb5b6df30007519146   # v1.7, 20. 10. 2026
permissions:
  contents: read
  packages: write
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cilium/tetragon
          ref: ${{ env.TETRAGON_COMMIT }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: verze
        run: echo "v=v1.7.1-$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          build-args: |
            TETRAGON_VERSION=${{ steps.verze.outputs.v }}
          push: true
          tags: |
            ghcr.io/simeckape-dev/tetragon:${{ steps.verze.outputs.v }}
